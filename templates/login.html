{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Login</h2>

   
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}

          <div style="
              color:red;
              background:#ffe6e6;
              padding:12px;
              margin-bottom:15px;
              border-radius:5px;
          ">
              {{ message }}
          </div>

        {% endfor %}
      {% endif %}
    {% endwith %}


    <form method="POST">

        <!-- CSRF Protection -->
        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >

        <input
            type="text"
            name="login_input"
            placeholder="Username or Email"
            required
            autocomplete="username"
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
