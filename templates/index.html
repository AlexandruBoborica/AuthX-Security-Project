<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthX Security Project</title>
</head>
<body>
    <h1>Welcome to AuthX Security Project</h1>
    <p>AuthX Security Project.</p>



    <a href="{{ url_for('login') }}" class="button">Login</a>
    <a href="{{ url_for('register') }}" class="button">Register</a>


    <h2>Registered Users</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody>
            {% if users %}
                {% for user in users %}
                <tr>
                    <td>{{ user[0] }}</td>
                    <td>{{ user[1] }}</td>
                    <td>{{ user[2] }}</td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="3">No users found in the database.</td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</body>
</html>
