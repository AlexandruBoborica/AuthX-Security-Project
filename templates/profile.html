{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Profile</h2>

    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Phone:</strong> {{ user.phone }}</p>
    <p><strong>Salary:</strong> {{ user.salary }}</p>

    <a href="/edit_profile/{{ user.id }}"><button>Edit Profile</button></a>
</div>
{% endblock %}
