{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Register</h2>

    <form method="POST">
        <input type="hidden"
               name="_csrf_token"
               value="{{ csrf_token() }}">
    
        <input type="email" name="email" placeholder="Email"><br><br>
    
        <input type="text"
               name="username"
               placeholder="Username"><br><br>
    
        <input type="text"
               name="phone"
               placeholder="Phone"><br><br>
    
        <input type="password"
               name="password"
               placeholder="Password"><br><br>
    
        <button type="submit">Register</button>
    </form>
</div>
{% endblock %}
