{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Create Ticket</h2>

    <form method="POST">
        <input type="text" name="title" placeholder="Title"><br><br>
        <textarea name="description" placeholder="Describe issue..." rows="5"></textarea><br><br>
        <button type="submit">Submit Ticket</button>
    </form>
</div>
{% endblock %}
