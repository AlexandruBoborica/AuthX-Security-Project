{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Reset Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}

    <div style="
      background:#ffe6e6;
      padding:12px;
      margin-bottom:15px;
      border-radius:5px;
    ">
      {{ message }}
    </div>

    {% endfor %}
    {% endif %}
    {% endwith %}


    <form method="POST">

        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required
        >

        <br><br>

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

{% endblock %}
